worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Do not advertise the nginx version to the world.
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    upstream webhost {
        server webhost:3000;
    }

    # The API is reachable only through this proxy — it publishes no host port of its
    # own, so the authenticated surface is never exposed directly to the internet.
    upstream api {
        server api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Container-local liveness probe, deliberately not redirected to HTTPS.
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /health {
            proxy_pass http://api/health;
            access_log off;
        }

        # Everything else, including the app's own /api/* routes, is served by the
        # webhost. Those routes attach the caller's token before reaching the API,
        # so the browser must never talk to the API directly.
        location / {
            proxy_pass http://webhost;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_read_timeout 60s;

            # The SkaapHond JWT set on /api/login and /api/session pushes the
            # Set-Cookie header past nginx's default 4k/8k proxy buffer, which
            # fails the whole response with "upstream sent too big header".
            proxy_buffer_size       16k;
            proxy_buffers           4 16k;
            proxy_busy_buffers_size 32k;
        }
    }
}
